name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 校验 tag 与 VERSION 一致
        run: |
          version="$(head -n 1 VERSION | tr -d ' \t\r\n')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 VERSION ($version) 不一致"
            exit 1
          fi

      - name: 运行自测
        run: bash tests/self-test.sh

      - name: 创建 GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          allowUpdates: true

      - name: 更新主版本标签（仅正式版）
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "$GITHUB_REF_NAME 为预发布版本，不更新主版本标签"
            exit 0
          fi
          major="${GITHUB_REF_NAME%%.*}"
          if [ "$major" = "$GITHUB_REF_NAME" ]; then
            echo "tag 不含次版本号，跳过主版本标签更新"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
